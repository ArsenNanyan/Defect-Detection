[project]
name = "industrial-defect-inspector"
version = "0.1.0"
description = "Industrial surface defect detection: classification, YOLO detection, segmentation/anomaly, ONNX, FastAPI, Streamlit."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
